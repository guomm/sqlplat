# Place this server block inside nginx's http block (or its included conf.d).
# Development: Vite on 5180, API on 8001. Restart Vite after changing base.
server {
    listen 127.0.0.1:18000;
    server_name localhost 127.0.0.1;

    location = /sqlplat {
        return 302 /sqlplat/;
    }

    location /sqlplat/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /sqlplat/;
    }

    location /sqlplat/ {
        # Preserve the URI; Vite serves this base path itself.
        proxy_pass http://127.0.0.1:5180;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Add other applications' location /xxx/ blocks here.
}
