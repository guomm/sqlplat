# Place this server block inside nginx's http block (or its included conf.d).
# Static files: /opt/www/sqlplat; API: 127.0.0.1:8001. No Vite service needed.
server {
    listen 127.0.0.1:18000;
    server_name localhost 127.0.0.1;

    location = /sqlplat {
        return 302 /sqlplat/;
    }
    location ^~ /sqlplat/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout 300s;
    }

# 静态资源不存在时直接返回 404
    location ^~ /sqlplat/assets/ {
        root /opt/www;
        try_files $uri =404;
    }

# 页面入口
    location /sqlplat/ {
        root /opt/www;
        index index.html;
        try_files $uri $uri/ /sqlplat/index.html;
    }

    # Add other applications' location /xxx/ blocks here.
}
