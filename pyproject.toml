[project]
name = "sql-atelier"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.129", "uvicorn>=0.30,<1", "SQLAlchemy>=2,<2.1",
  "alembic>=1.13,<2", "PyMySQL[rsa]>=1.2.3,<2", "cryptography>=43",
  "argon2-cffi>=23", "openpyxl>=3.1,<4", "pydantic-settings>=2,<3"
]
[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
